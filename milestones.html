<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dấu ấn trung tâm - IHSND UMP</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .milestones-wrapper {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    /* Thanh lọc theo Tag */
    .tag-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .tag-pill {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--navy);
      background: rgba(255, 255, 255, 0.78);
      color: var(--navy);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-pill.active,
    .tag-pill:hover {
      background: var(--navy);
      color: var(--white);
    }

    /* Lưới các ô Dấu ấn */
    .milestones-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .milestone-card {
      position: relative;
      height: 320px;
      border-radius: 18px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-color: #1b3664;
      box-shadow: 0 10px 26px rgba(27, 54, 100, 0.18);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 20px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .milestone-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(12, 24, 48, 0.92) 0%,
        rgba(12, 24, 48, 0.45) 52%,
        rgba(12, 24, 48, 0.18) 100%
      );
      z-index: 1;
      transition: opacity 0.25s;
    }

    .milestone-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 34px rgba(27, 54, 100, 0.28);
    }

    .card-top,
    .card-bottom {
      position: relative;
      z-index: 2;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-tag-badge {
      background: rgba(255, 255, 255, 0.9);
      color: var(--navy);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .card-admin-actions {
      display: flex;
      gap: 6px;
    }

    .card-icon-btn {
      background: rgba(255, 255, 255, 0.9);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }

    .card-icon-btn:hover {
      transform: scale(1.1);
      background: #fff;
    }

    .card-date {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 6px;
    }

    .card-title {
      color: #ffffff;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      color: rgba(255, 255, 255, 0.88);
      font-size: 13.5px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ================= GIAO DIỆN ĐỌC BÀI VIẾT ================= */
    .article-container {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 36px 44px;
      box-shadow: 0 12px 34px rgba(27, 54, 100, 0.15);
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .article-tag {
      background: var(--navy);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .article-date {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
    }

    .article-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--navy-dark);
      line-height: 1.3;
      margin-bottom: 18px;
    }

    .article-lead {
      font-size: 17px;
      font-weight: 600;
      color: #374151;
      line-height: 1.65;
      padding-left: 16px;
      border-left: 4px solid var(--navy);
      margin-bottom: 24px;
    }

    .article-hero-img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 28px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .article-body {
      font-size: 16.5px;
      line-height: 1.85;
      color: #1f2937;
      text-align: justify;
    }

    .article-body p {
      margin-bottom: 18px;
    }

    /* Form preview ảnh */
    .thumb-preview {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
      display: none;
      border: 1.5px solid #d1d5db;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 16px;
      font-size: 16px;
      color: var(--text-muted);
    }

    @media (max-width: 960px) {
      .milestones-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .milestones-grid {
        grid-template-columns: 1fr;
      }
      .article-container {
        padding: 24px 20px;
      }
      .article-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body class="bg-menu">
  <div id="topUserBar" class="top-user-bar"></div>

  <!-- ================= CHẾ ĐỘ XEM LƯỚI (DANH SÁCH BÀI) ================= -->
  <div id="gridView" class="milestones-wrapper">
    <div class="action-bar">
      <a href="menu.html" class="back-btn">← Quay lại Menu</a>
      <div id="adminCreateBar" style="display: none;">
        <button class="btn-sm" onclick="openPostModal()">+ Đăng bài mới</button>
      </div>
    </div>

    <h1 class="page-title">DẤU ẤN TRUNG TÂM</h1>

    <!-- Bộ lọc theo Tag -->
    <div id="tagFilterBar" class="tag-filter-bar"></div>

    <!-- Lưới các ô bài viết -->
    <div id="milestonesGrid" class="milestones-grid"></div>
  </div>

  <!-- ================= CHẾ ĐỘ ĐỌC CHI TIẾT BÀI VIẾT ================= -->
  <div id="articleView" class="milestones-wrapper" style="display: none;">
    <div class="action-bar">
      <button class="back-btn" onclick="backToGrid()">← Quay lại danh sách Dấu ấn</button>
      <div id="articleAdminActions" style="display: none; gap: 8px;">
        <button class="btn-sm secondary" id="btnEditCurrent">✏️ Sửa bài</button>
        <button class="btn-sm" style="background: var(--danger);" id="btnDeleteCurrent">🗑️ Xóa bài</button>
      </div>
    </div>

    <article class="article-container">
      <div id="artMeta" class="article-meta"></div>
      <h1 id="artTitle" class="article-title"></h1>
      <p id="artLead" class="article-lead"></p>
      <img id="artHero" class="article-hero-img" src="" alt="Ảnh bài viết" />
      <div id="artBody" class="article-body"></div>
    </article>
  </div>

  <!-- ================= MODAL ĐĂNG / SỬA BÀI (CHỈ ADMIN) ================= -->
  <div id="postModal" class="modal-overlay">
    <div class="modal-box" style="max-width: 640px;">
      <h3 id="modalHeading" style="color: var(--navy); margin-bottom: 18px; font-size: 20px;">Đăng bài Dấu ấn mới</h3>
      <form id="postForm">
        <input type="hidden" id="pId" />

        <div class="form-group">
          <label for="pTitle">Tiêu đề bài viết *</label>
          <input type="text" id="pTitle" required placeholder="Nhập tiêu đề nổi bật..." />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label for="pDate">Ngày hiển thị *</label>
            <input type="date" id="pDate" required />
          </div>
          <div class="form-group">
            <label for="pTags">Tag (cách nhau bằng dấu phẩy) *</label>
            <input type="text" id="pTags" required placeholder="VD: Giao lưu quốc tế, Hội nghị" />
          </div>
        </div>

        <div class="form-group">
          <label for="pDesc">Mô tả ngắn *</label>
          <textarea id="pDesc" rows="2" required placeholder="Tóm tắt ngắn gọn hiển thị ngoài ô bài viết và phần mở đầu..."></textarea>
        </div>

        <div class="form-group">
          <label>Ảnh đại diện (Thumbnail) *</label>
          <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
            <label class="btn-sm secondary" style="cursor: pointer; margin: 0;">
              📁 Chọn ảnh từ máy
              <input type="file" id="pImageFile" accept="image/*" style="display: none;" />
            </label>
            <span style="font-size: 13px; color: var(--text-muted);">hoặc dán link ảnh bên dưới:</span>
          </div>
          <input type="text" id="pImageUrl" placeholder="https://..." />
          <img id="thumbPreview" class="thumb-preview" alt="Xem trước ảnh" />
        </div>

        <div class="form-group">
          <label for="pContent">Nội dung bài viết chi tiết *</label>
          <textarea id="pContent" rows="7" required placeholder="Viết nội dung bài viết tại đây. Nhấn Enter để xuống dòng tách đoạn..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px;">
          <button type="button" class="btn-sm secondary" onclick="closePostModal()">Hủy</button>
          <button type="submit" class="btn-sm">Lưu & Đăng bài</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const currentUser = requireAuth("milestones");
    const isAdmin = currentUser && currentUser.role === "admin";
    const MILESTONES_KEY = "IHSND_MILESTONES_DB";

    // Bài viết mẫu ban đầu để hiển thị giao diện
    const DEFAULT_MILESTONES = [
      {
        id: "ms-1",
        title: "The Cultural Harmony — Dấu ấn Hội nhập Quốc tế",
        shortDesc: "Nhìn lại hành trình kết nối văn hóa và học thuật giữa sinh viên Y Dược TP.HCM cùng bạn bè quốc tế.",
        date: "2026-11-10",
        tags: ["Giao lưu văn hóa", "Nổi bật"],
        thumbnail: "https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&w=1000&q=80",
        content: "Chương trình The Cultural Harmony đã mang đến không gian giao lưu đa văn hóa đầy màu sắc dành cho sinh viên khối ngành Khoa học Sức khỏe.\n\nThông qua các hoạt động trải nghiệm, chia sẻ câu chuyện và làm việc nhóm, các bạn sinh viên không chỉ mở rộng góc nhìn về y tế toàn cầu mà còn xây dựng những tình bạn bền chặt vượt biên giới.\n\nĐây là một trong những cột mốc đáng tự hào của Trung tâm Phát triển Mạng lưới Sinh viên Quốc tế trong nhiệm kỳ năm nay."
      },
      {
        id: "ms-2",
        title: "Hội nghị Giáo dục Y học & Kết nối Mạng lưới Sinh viên",
        shortDesc: "Đại diện sinh viên Trung tâm tham gia báo cáo, trao đổi học thuật và mở rộng mạng lưới hợp tác.",
        date: "2026-06-20",
        tags: ["Hội nghị", "Học thuật"],
        thumbnail: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=1000&q=80",
        content: "Trong khuôn khổ hội nghị, các đại biểu sinh viên đã có cơ hội trình bày các dự án cộng đồng, lắng nghe chia sẻ từ các chuyên gia đầu ngành và kết nối với mạng lưới sinh viên y khoa khu vực.\n\nNhững bài học và mối quan hệ được xây dựng từ chuyến đi sẽ tiếp tục là nền tảng cho các chương trình trao đổi chuyên môn sắp tới tại Trung tâm."
      }
    ];

    let activeTag = "Tất cả";
    let uploadedBase64 = "";

    function getPosts() {
      const raw = localStorage.getItem(MILESTONES_KEY);
      if (!raw) {
        localStorage.setItem(MILESTONES_KEY, JSON.stringify(DEFAULT_MILESTONES));
        return DEFAULT_MILESTONES;
      }
      return JSON.parse(raw);
    }

    function savePosts(posts) {
      localStorage.setItem(MILESTONES_KEY, JSON.stringify(posts));
    }

    function formatDateVN(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split("-");
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }

    // Tạo thanh lọc Tag
    function renderTagFilters() {
      const posts = getPosts();
      const tagSet = new Set(["Tất cả"]);
      posts.forEach(p => (p.tags || []).forEach(t => tagSet.add(t)));

      const bar = document.getElementById("tagFilterBar");
      bar.innerHTML = Array.from(tagSet).map(tag => `
        <button class="tag-pill ${tag === activeTag ? "active" : ""}" onclick="filterByTag('${tag.replace(/'/g, "\\'")}')">
          ${tag}
        </button>
      `).join("");
    }

    function filterByTag(tag) {
      activeTag = tag;
      renderTagFilters();
      renderGrid();
    }

    // Hiển thị lưới ô bài viết (sắp xếp ngày mới nhất lên đầu)
    function renderGrid() {
      const grid = document.getElementById("milestonesGrid");
      let posts = getPosts().sort((a, b) => (b.date || "").localeCompare(a.date || ""));

      if (activeTag !== "Tất cả") {
        posts = posts.filter(p => (p.tags || []).includes(activeTag));
      }

      if (!posts.length) {
        grid.innerHTML = `<div class="empty-state">Chưa có bài viết nào trong mục này.</div>`;
        return;
      }

      grid.innerHTML = posts.map(post => `
        <div class="milestone-card" style="background-image: url('${post.thumbnail}')" onclick="openArticle('${post.id}')">
          <div class="card-top">
            <div class="card-tags">
              ${(post.tags || []).map(t => `<span class="card-tag-badge">${t}</span>`).join("")}
            </div>
            ${isAdmin ? `
              <div class="card-admin-actions" onclick="event.stopPropagation()">
                <button class="card-icon-btn" title="Sửa bài" onclick="openPostModal('${post.id}')">✏️</button>
                <button class="card-icon-btn" title="Xóa bài" onclick="deletePost('${post.id}')">🗑️</button>
              </div>
            ` : ""}
          </div>
          <div class="card-bottom">
            <div class="card-date">📅 ${formatDateVN(post.date)}</div>
            <h2 class="card-title">${post.title}</h2>
            <p class="card-desc">${post.shortDesc}</p>
          </div>
        </div>
      `).join("");
    }

    // Mở chế độ đọc bài viết
    function openArticle(id) {
      const post = getPosts().find(p => p.id === id);
      if (!post) return;

      document.getElementById("gridView").style.display = "none";
      document.getElementById("articleView").style.display = "block";

      document.getElementById("artMeta").innerHTML = `
        ${(post.tags || []).map(t => `<span class="article-tag">${t}</span>`).join("")}
        <span class="article-date">• ${formatDateVN(post.date)}</span>
      `;
      document.getElementById("artTitle").textContent = post.title;
      document.getElementById("artLead").textContent = post.shortDesc;
      document.getElementById("artHero").src = post.thumbnail;

      // Tách từng đoạn văn khi nhấn Enter
      const paragraphs = (post.content || "").split(/\n+/).filter(p => p.trim() !== "");
      document.getElementById("artBody").innerHTML = paragraphs
        .map(p => `<p>${p.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</p>`)
        .join("");

      if (isAdmin) {
        const actions = document.getElementById("articleAdminActions");
        actions.style.display = "flex";
        document.getElementById("btnEditCurrent").onclick = () => openPostModal(post.id);
        document.getElementById("btnDeleteCurrent").onclick = () => deletePost(post.id);
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function backToGrid() {
      document.getElementById("articleView").style.display = "none";
      document.getElementById("gridView").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ================= CHỨC NĂNG ADMIN: ĐĂNG / SỬA / XÓA =================
    function openPostModal(editId = null) {
      uploadedBase64 = "";
      document.getElementById("pImageFile").value = "";
      const preview = document.getElementById("thumbPreview");

      if (editId) {
        const post = getPosts().find(p => p.id === editId);
        if (!post) return;
        document.getElementById("modalHeading").textContent = "Chỉnh sửa bài viết";
        document.getElementById("pId").value = post.id;
        document.getElementById("pTitle").value = post.title;
        document.getElementById("pDate").value = post.date;
        document.getElementById("pTags").value = (post.tags || []).join(", ");
        document.getElementById("pDesc").value = post.shortDesc;
        document.getElementById("pContent").value = post.content;

        if (post.thumbnail.startsWith("data:image")) {
          uploadedBase64 = post.thumbnail;
          document.getElementById("pImageUrl").value = "";
        } else {
          document.getElementById("pImageUrl").value = post.thumbnail;
        }
        preview.src = post.thumbnail;
        preview.style.display = "block";
      } else {
        document.getElementById("modalHeading").textContent = "Đăng bài Dấu ấn mới";
        document.getElementById("postForm").reset();
        document.getElementById("pId").value = "";
        document.getElementById("pDate").value = new Date().toISOString().split("T")[0];
        preview.style.display = "none";
      }

      document.getElementById("postModal").classList.add("active");
    }

    function closePostModal() {
      document.getElementById("postModal").classList.remove("active");
    }

    // Nén ảnh khi Admin upload từ máy để lưu mượt mà
    document.getElementById("pImageFile").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const maxW = 1000;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          uploadedBase64 = canvas.toDataURL("image/jpeg", 0.78);
          document.getElementById("pImageUrl").value = "";
          const preview = document.getElementById("thumbPreview");
          preview.src = uploadedBase64;
          preview.style.display = "block";
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Xem trước khi dán link ảnh
    document.getElementById("pImageUrl").addEventListener("input", function (e) {
      const url = e.target.value.trim();
      const preview = document.getElementById("thumbPreview");
      if (url) {
        uploadedBase64 = "";
        preview.src = url;
        preview.style.display = "block";
      }
    });

    // Lưu bài viết
    document.getElementById("postForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const id = document.getElementById("pId").value;
      const thumbnail = uploadedBase64 || document.getElementById("pImageUrl").value.trim();

      if (!thumbnail) {
        alert("Vui lòng chọn ảnh từ máy hoặc dán link ảnh đại diện!");
        return;
      }

      const tagsArr = document.getElementById("pTags").value
        .split(",")
        .map(t => t.trim())
        .filter(Boolean);

      const postObj = {
        id: id || "ms-" + Date.now(),
        title: document.getElementById("pTitle").value.trim(),
        date: document.getElementById("pDate").value,
        tags: tagsArr.length ? tagsArr : ["Dấu ấn"],
        shortDesc: document.getElementById("pDesc").value.trim(),
        thumbnail: thumbnail,
        content: document.getElementById("pContent").value.trim()
      };

      const posts = getPosts();
      if (id) {
        const idx = posts.findIndex(p => p.id === id);
        if (idx >= 0) posts[idx] = postObj;
      } else {
        posts.unshift(postObj);
      }

      savePosts(posts);
      closePostModal();
      renderTagFilters();
      renderGrid();

      // Nếu đang ở chế độ đọc bài thì cập nhật luôn nội dung bài đang xem
      if (document.getElementById("articleView").style.display === "block") {
        openArticle(postObj.id);
      }
    });

    function deletePost(id) {
      if (!confirm("Bạn có chắc muốn xóa bài viết này không?")) return;
      const posts = getPosts().filter(p => p.id !== id);
      savePosts(posts);
      backToGrid();
      renderTagFilters();
      renderGrid();
    }

    // Khởi tạo trang
    if (currentUser) {
      if (isAdmin) {
        document.getElementById("adminCreateBar").style.display = "block";
      }
      renderTagFilters();
      renderGrid();
    }
  </script>
