<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHSND UMP - Cổng Thông Tin Thành Viên</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #0056b3;
            margin-bottom: 10px;
        }
        h2 {
            color: #4a5568;
            font-size: 1.2rem;
            margin-top: 0;
        }
        p {
            color: #718096;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IHSND UMP</h1>
        <h2>Cổng Thông Tin Quản Lý Thành Viên</h2>
        <p>Chào mừng bạn đến với hệ thống nội bộ của Trung tâm Phát triển Mạng lưới Sinh viên Y khoa Quốc tế - Đại học Y Dược TP.HCM.</p>
        <a href="#" class="btn">Đăng nhập hệ thống</a>
    </div>
</body>
</html>
